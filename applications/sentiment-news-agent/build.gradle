plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'maven-publish'
	id 'signing'
}

group = 'com.github.ggreen'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
	set('springCloudVersion', "2025.1.1")
}

dependencies {
	implementation 'com.github.nyla-solutions:nyla.solutions.core:2.5.2'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-redis'
	implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
	implementation 'org.springframework.ai:spring-ai-rag'
	implementation 'org.springframework.cloud:spring-cloud-function-web'
	implementation 'org.springframework.ai:spring-ai-tika-document-reader'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-redis'

	implementation 'org.springframework.amqp:spring-rabbit-stream'
	implementation 'org.springframework.cloud:spring-cloud-stream'
	implementation 'org.springframework.cloud:spring-cloud-stream-binder-rabbit'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
	testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencies {
	implementation project(':components:trading-domain')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}



publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			pom {
				name = 'com.github.ggreen'
				groupId = group
				artifactId = 'sentiment-news-agent'
				description = 'sentiment-news-agent'

				versionMapping {
					usage('java-api') {
						fromResolutionOf('runtimeClasspath')
					}
					usage('java-runtime') {
						fromResolutionResult()
					}
				}
				url = 'https://github.com/nyla-solutions/nyla'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
				developers {
					developer {
						id = 'ggreen'
						name = 'Gregory Green'
						email = 'ggreen@g-solutions.net'
					}
				}
				scm {
					connection = 'scm:git:https://github.com/ggreen/financial-trading-ai-agentic-showcase.git'
					developerConnection = 'scm:git:https://github.com/ggreen/financial-trading-ai-agentic-showcase.git'
					url = 'https://github.com/ggreen/financial-trading-ai-agentic-showcase.git'
				}
			}
		}
	}

	repositories {
		maven {
			name = 'Maven'
			def releasesRepoUrl = layout.buildDirectory.dir('repos/releases')
			def snapshotsRepoUrl = layout.buildDirectory.dir('repos/snapshots')
			url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
		}
	}
}

signing {
//  def signingKeyId = System.getenv("GPG_PRIVATE_KEY_ID")
	def signingPassword = System.getenv("GPG_PASSPHRASE")
	def signingKey = System.getenv("GPG_PRIVATE_KEY")?.replace("\\n", "\n")

	useInMemoryPgpKeys(signingKey, signingPassword)
	sign publishing.publications.mavenJava
}

javadoc {
	if(JavaVersion.current().isJava9Compatible()) {
		options.addBooleanOption('html5', true)
	}
}

// Task to zip up the published repository folder
tasks.register('createRepoZip', Zip) {
	dependsOn tasks.named('publishMavenJavaPublicationToMavenRepository')

	archiveBaseName = 'sentiment-news-agent'
	archiveClassifier = 'repo'
	archiveVersion = project.version.toString()
	destinationDirectory = layout.buildDirectory.dir('distributions')

	// Include files published in the local build repository
	def repoDir = version.endsWith('SNAPSHOT') ?
			layout.buildDirectory.dir('repos/snapshots') :
			layout.buildDirectory.dir('repos/releases')

	from repoDir
}

// Ensures running 'publish' also triggers zip archive generation
tasks.named('publish') {
	finalizedBy tasks.named('createRepoZip')
}