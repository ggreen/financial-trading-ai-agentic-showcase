plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'signing'
}

group = 'com.github.ggreen'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url "https://packages.broadcom.com/artifactory/gemfire/"
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
        credentials {
            username System.getenv('BROADCOM_MAVEN_USERNAME')
            password System.getenv('BROADCOM_GEMFIRE_MAVEN_PASSWORD')
        }
    }
}

// Defining your properties/extra variables
ext {
    set('springCloudVersion', "2025.1.1")
    springBootForGemFireVersion = '2.0.0'
    vmwareGemFireVersion = '10.2.0'
}

dependencies {
    // Spring Cloud Bill of Materials (BOM) - replaces <dependencyManagement>
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")

    // Project Dependencies with Explicit Versions
    implementation "com.vmware.gemfire:spring-boot-4.0-gemfire-10.2:$springBootForGemFireVersion"
    implementation "com.vmware.gemfire:gemfire-core:$vmwareGemFireVersion"

    implementation 'com.github.nyla-solutions:nyla.solutions.core:2.5.2'

    // Spring Boot & Cloud Starters (Versions managed by parent plugin/BOM)
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.springframework.cloud:spring-cloud-starter-task'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'

    // Runtime Only
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Lombok Configuration (Handles <optional>true</optional>)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing Dependencies
    testCompileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'jakarta.activation:jakarta.activation-api'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation project(':components:trading-domain')
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'com.github.ggreen'
                groupId = group
                artifactId = 'stock-daily-price-batch'
                description = 'stock-daily-price-batch'

                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }
                url = 'https://github.com/nyla-solutions/nyla'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'ggreen'
                        name = 'Gregory Green'
                        email = 'ggreen@g-solutions.net'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ggreen/financial-trading-ai-agentic-showcase.git'
                    developerConnection = 'scm:git:https://github.com/ggreen/financial-trading-ai-agentic-showcase.git'
                    url = 'https://github.com/ggreen/financial-trading-ai-agentic-showcase.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'Maven'
            def releasesRepoUrl = layout.buildDirectory.dir('repos/releases')
            def snapshotsRepoUrl = layout.buildDirectory.dir('repos/snapshots')
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
        }
    }
}

signing {
//  def signingKeyId = System.getenv("GPG_PRIVATE_KEY_ID")
    def signingPassword = System.getenv("GPG_PASSPHRASE")
    def signingKey = System.getenv("GPG_PRIVATE_KEY")?.replace("\\n", "\n")

    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

// Task to zip up the published repository folder
tasks.register('createRepoZip', Zip) {
    dependsOn tasks.named('publishMavenJavaPublicationToMavenRepository')

    archiveBaseName = 'stock-daily-price-batch'
    archiveClassifier = 'repo'
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('distributions')

    // Include files published in the local build repository
    def repoDir = version.endsWith('SNAPSHOT') ?
            layout.buildDirectory.dir('repos/snapshots') :
            layout.buildDirectory.dir('repos/releases')

    from repoDir
}

// Ensures running 'publish' also triggers zip archive generation
tasks.named('publish') {
    finalizedBy tasks.named('createRepoZip')
}